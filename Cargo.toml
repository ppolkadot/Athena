[package]
name = "athena"
version = "1.1.1"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
rusqlite = { version = "0.42", features = ["bundled", "functions", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
rust_decimal = "1.43"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
directories = "6"
rfd = "0.18"
tempfile = "3"
sys-locale = "0.3"
fs4 = "1.1"
unicode-normalization = "0.1"

[dev-dependencies]
proptest = "1"
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
ttf-parser = "0.25"

[build-dependencies]
winresource = "0.1"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
