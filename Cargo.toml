[package]
name = "athena"
version = "1.2.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
rusqlite = { version = "0.42", features = ["bundled", "functions", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
rust_decimal = "1.43"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
directories = "6"
rfd = "0.18"
tempfile = "3"
sys-locale = "0.3"
fs4 = "1.1"
unicode-normalization = "0.1"
rust_xlsxwriter = "0.102.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
proptest = "1"
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
ttf-parser = "0.25"
calamine = "0.38.0"

[build-dependencies]
winresource = "0.1"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
