name: Windows CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Tests & Doc-Lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run locked test suite
        run: cargo test --locked

      - name: Run document lint
        shell: bash
        run: bash docs/superpowers/doc-lint.sh

  package:
    name: Build Release & Installer
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compilerDir = Join-Path $env:RUNNER_TEMP 'athena-inno-6.7.3'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $expected = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          curl.exe --fail --location --retry 3 --retry-delay 3 --output $setup $url
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup download failed ($LASTEXITCODE)" }
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne $expected) {
            throw 'Inno Setup 6.7.3 download failed SHA-256 verification'
          }
          $process = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PORTABLE=1', ('/DIR="' + $compilerDir + '"')
          ) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited with $($process.ExitCode)" }
          $iscc = Join-Path $compilerDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe not found at $iscc" }
          "ATHENA_ISCC=$iscc" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Compile installer
        shell: pwsh
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'athena' } | Select-Object -ExpandProperty version
          $definition = '#define AppVersion "' + $version + '"'
          if (-not $version -or (Get-Content installer\athena.iss) -cnotcontains $definition) {
            throw "Installer AppVersion does not match Cargo.toml ($version)"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml ($version)"
          }
          & $env:ATHENA_ISCC installer\athena.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ATHENA_VERSION=$version" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force target\package
          Copy-Item target\release\athena.exe (Join-Path $dir "athena-$env:ATHENA_VERSION-windows-x64.exe")
          Copy-Item "target\installer\Athena-$env:ATHENA_VERSION-setup.exe" $dir
          Copy-Item assets\fonts\LICENSE.txt $dir
          $files = @(
            (Get-Item (Join-Path $dir "athena-$env:ATHENA_VERSION-windows-x64.exe")),
            (Get-Item (Join-Path $dir "Athena-$env:ATHENA_VERSION-setup.exe")),
            (Get-Item (Join-Path $dir 'LICENSE.txt'))
          )
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: athena-windows-release
          path: |
            target/package/athena-*-windows-x64.exe
            target/package/Athena-*-setup.exe
            target/package/LICENSE.txt
            target/package/SHA256SUMS.txt
          if-no-files-found: error
